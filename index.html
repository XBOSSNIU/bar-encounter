<section class="age" id="age"><div class="card"><h1>午夜心动</h1><p>所有角色均为 21 岁以上成年人。所有亲密互动均建立在双方明确自愿的基础上。</p><button class="primary" id="enter">我已年满18岁，进入故事</button></div></section>

const game=$('#game'),myDice=$('#myDice'),herDice=$('#herDice'),bidEl=$('#bid'),log=$('#log'),qty=$('#qty'),face=$('#face'),mode=$('#mode'),raise=$('#raise'),call=$('#call');for(let i=2;i<=20;i++)qty.add(new Option(i+' 个',i));for(let i=1;i<=6;i++)face.add(new Option(i+' 点',i));let mine=[],hers=[],bid=null,over=false,turn='player';const roll=()=>Array.from({length:5},()=>1+Math.random()*6|0),die=(n,hidden=false)=>`<span class="die ${hidden?'hidden':''}">${n}</span>`;
function startGame(){rounds++;mine=roll();hers=roll();bid=null;over=false;turn='player';myDice.innerHTML=mine.map(n=>die(n)).join('');herDice.innerHTML=hers.map(()=>die('?',true)).join('');qty.value=2;face.value=1;mode.value='zhai';mode.disabled=false;bidEl.textContent='请选择合法起叫';log.textContent='你先叫骰：2 个 1，或 3 个 2～6。';call.disabled=true;raise.disabled=false;game.classList.add('show')}
